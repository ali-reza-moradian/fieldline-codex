services:
  - type: web
    name: fieldline-nfl-odds
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: HOST
        value: 0.0.0.0
